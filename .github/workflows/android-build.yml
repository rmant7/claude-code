name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'WhisperTranscriber/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'WhisperTranscriber/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhisperTranscriber
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK and CMake
        run: sdkmanager --install "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcriber-debug-apk
          path: WhisperTranscriber/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
