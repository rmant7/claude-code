name: Android Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'WhisperTranscriber/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'WhisperTranscriber/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhisperTranscriber
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install NDK and CMake
        run: sdkmanager --install "platforms;android-34" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK (app + instrumented test APK)
        run: gradle assembleDebug assembleDebugAndroidTest -PbuildNumber=${{ github.run_number }} --stacktrace --no-daemon

      - name: Enable KVM group perms for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          working-directory: WhisperTranscriber
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle connectedDebugAndroidTest -PbuildNumber=${{ github.run_number }} --stacktrace --no-daemon

      - name: Rename APK with version number
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/whisper_debug_${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper_debug_${{ github.run_number }}
          path: WhisperTranscriber/app/build/outputs/apk/debug/whisper_debug_${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Delete previous APK assets from the release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view whisper-debug-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          for asset in $assets; do
            gh release delete-asset whisper-debug-latest "$asset" --repo "${{ github.repository }}" -y || true
          done

      - name: Publish release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: whisper-debug-latest
          name: Whisper Transcriber debug APK (latest build)
          body: |
            Automatically built debug APK from commit ${{ github.sha }} (build ${{ github.run_number }}).
            Download `whisper_debug_${{ github.run_number }}.apk` below directly — this is a GitHub
            Release asset, not an Actions artifact, so it downloads as a plain .apk with no zip step.
          files: WhisperTranscriber/app/build/outputs/apk/debug/whisper_debug_${{ github.run_number }}.apk
          make_latest: true

      - name: Upload test reports (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports_${{ github.run_number }}
          path: |
            WhisperTranscriber/app/build/reports/tests
            WhisperTranscriber/app/build/reports/androidTests
          if-no-files-found: ignore
